name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort ruff mypy pytest
    
    - name: Run Black check
      run: black --check .
    
    - name: Run isort check
      run: isort --check-only .
    
    - name: Run Ruff
      run: ruff check .
    
    - name: Run mypy
      run: mypy .
    
    - name: Run pytest
      run: pytest

  integration:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opengovsa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Alembic migration check
      run: |
        export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/opengovsa_test"
        alembic check
    
    - name: Uvicorn startup test
      run: timeout 10 uvicorn app.main:app --host 0.0.0.0 --port 8000 || exit 0
    
    - name: Health endpoint integration test
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/api/v1/health || exit 1
        curl -f http://localhost:8000/api/v1/health/live || exit 1
        curl -f http://localhost:8000/api/v1/health/ready || exit 1

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t opengovsa-backend .
    
    - name: Validate docker-compose config
      run: docker-compose config
